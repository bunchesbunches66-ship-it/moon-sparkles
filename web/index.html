<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MoonSparkles — Nyarch Local</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <h2>Conversations</h2>
      <ul id="convo-list"></ul>
      <button id="new-convo">New</button>
      <hr />
      <h3>Admin</h3>
      <label>System prompt</label>
      <textarea id="system-prompt" rows="4"></textarea>
      <button id="save-prompt">Save prompt</button>
      <button id="export">Export convos</button>
    </aside>

    <main class="chat-area">
      <div id="messages" class="messages"></div>
      <form id="input-form">
        <input id="message-input" autocomplete="off" placeholder="Say something to Nyarch..." />
        <button>Send</button>
      </form>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
